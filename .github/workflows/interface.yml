name: Interface build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci --prefix interface
      - run: npm run build --prefix interface
      - run: git diff --exit-code -- shared/interface
