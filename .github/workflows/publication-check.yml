name: Publication integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  public-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public pages, module dependencies and catalogue
        run: python scripts/check-publication.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check city rewards, project goals and backup restoration
        run: node scripts/check-city-journey.mjs
