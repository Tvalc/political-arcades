<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Political Arcades</title>
  <link rel="canonical" href="https://politicalarcades.com/" />
  <meta name="description" content="Political Arcades is a browser arcade. Capitol Crashers is the first machine on the floor." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="room">
    <header class="sign">
      <p class="open"><span class="lamp"></span> Floor open</p>
      <h1>Political<br />Arcades</h1>
      <p class="lede">One cabinet is powered. The rest of the row is still dark.</p>
      <a class="patreon" href="https://www.patreon.com/c/PoliticalArcades" target="_blank" rel="noopener noreferrer">Support on Patreon</a>
    </header>

    <footer class="site-foot">
      <p>Capitol Crashers is the first game on this floor. It is an original game, not affiliated with any other publisher.</p>
      <p><a href="privacy.html">Privacy</a></p>
    </footer>

    <main class="floor">
      <article class="cab off" aria-hidden="true">
        <div class="marquee"><span>····</span></div>
        <div class="glass dead"></div>
        <div class="deck"><i></i><i></i><b></b></div>
      </article>

      <a class="cab on" href="http://capitolcrashers.com/">
        <div class="marquee"><span>Capitol Crashers</span></div>
        <div class="glass">
          <img src="art/screen.jpg" alt="Capitol Crashers attract mode, a night street in front of a rally stage" />
          <div class="scan"></div>
          <p class="insert">Press start</p>
        </div>
        <div class="deck">
          <i class="stick"></i>
          <b class="red"></b>
          <b class="gold"></b>
        </div>
        <p class="plate"><span class="ready"></span> Machine 01 · ready</p>
      </a>

      <article class="cab off" aria-hidden="true">
        <div class="marquee"><span>····</span></div>
        <div class="glass dead"></div>
        <div class="deck"><i></i><i></i><b></b></div>
      </article>
    </main>

  </div>
</body>
</html>
