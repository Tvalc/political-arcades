<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City art v12 · Visual review</title><style>body{margin:0;background:#10232b;color:#f3dfb5;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}button{padding:12px 18px;background:#edc674;border:0;border-radius:8px;font:inherit;margin:4px;color:#192b30}canvas{width:100%;display:block;border-radius:16px}p{line-height:1.5}.map{overflow-x:auto}canvas{min-width:760px}@media(min-width:800px){canvas{min-width:0}}</style><main><h1>Your city · art review</h1><p>Visual fixtures only. These controls never change your saved city or supplies.</p><nav><button data-scene="mixed">Thriving neighborhood</button><button data-scene="empty">Open plots</button><button data-scene="homes">Six homes</button><button data-scene="kitchen">Six kitchens</button><button id="repair">Compare repaired street</button></nav><div class="map"><canvas width="1200" height="800" aria-label="Six city destinations with animated neighbors"></canvas></div><p id="status" role="status">Loading matching Makko art…</p></main><script type="module">import{paintWorld,worldReady}from '/city/world-v12.mjs?v=12.1';const canvas=document.querySelector('canvas');let block={lots:['homes','park','court','clinic','kitchen','fountain'],road:false};const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{block.lots=b.dataset.scene==='mixed'?['homes','park','court','clinic','kitchen','fountain']:b.dataset.scene==='empty'?[]:Array(6).fill(b.dataset.scene);});document.querySelector('#repair').onclick=()=>block.road=!block.road;await worldReady;document.querySelector('#status').textContent='Matching camera, materials and scale. Real animated residents and organizer. No artificial character rocking.';function frame(t){paintWorld(canvas,block,0,t/1000,reduced);requestAnimationFrame(frame);}requestAnimationFrame(frame);</script></html>
