<!doctype html><html lang="en"><meta name="robots" content="noindex,follow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outreach scene review</title><link rel="stylesheet" href="style.css?v=8.1"><style>main{max-width:1040px}.review-controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.review-controls button{min-width:90px}.review-scenes{display:grid;grid-template-columns:1fr 1fr;gap:20px}.review-scenes canvas{max-width:100%}@media(max-width:700px){.review-scenes{grid-template-columns:1fr}}</style><main><h1>Neighborhood moments</h1><p>Isolated art review. These controls do not change your saved city.</p><div class="review-controls"><button data-visits="0">Before</button><button data-visits="1">1 visit</button><button data-visits="3">3 visits</button><button data-visits="6">6 visits</button><button data-visits="12">12 visits</button></div><outreach-neighborhood></outreach-neighborhood><p><a href="./?practice=1">Play a practice run without saving rewards</a></p></main><script type="module">import './neighborhood.mjs?v=8.1';for(const b of document.querySelectorAll('[data-visits]'))b.onclick=()=>document.querySelector('outreach-neighborhood').setCount(Number(b.dataset.visits));</script></html>
